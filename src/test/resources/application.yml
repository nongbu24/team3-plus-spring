spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

jwt:
  secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  access-token-expiration-millis: 3600000

  REDIS_HOST: localhost
  REDIS_PORT: 6379
